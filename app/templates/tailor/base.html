{% extends "base.html" %}
{% block title %}Stichie - Tailor{% endblock %}
{% block navbar %}
<style>
    .navbar {
        background-color: var(--primary);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .navbar a {
        text-decoration: none;
        color: white;
        margin: 0 15px;
        font-weight: bold;
    }
    .navbar a:hover {
        color: var(--light-orange);
    }
    .page-content {
        max-width: 1100px;
        margin: 20px auto;
    }
</style>

<nav class="navbar">
    <div class="flex items-center space-x-4">
        <a href="{{ url_for('tailor.dashboard') }}" class="text-2xl font-bold">Stichie</a>
        <a href="{{ url_for('tailor.my_services') }}">Services</a>
        <a href="{{ url_for('tailor.orders') }}">Orders</a>
        <a href="{{ url_for('tailor.earnings') }}">Earnings</a>
    </div>
    <div class="flex items-center space-x-4">
        <a href="{{ url_for('tailor.profile') }}">Profile</a>
        <div class="notification-bell">
            <span id="notification-bell">🔔</span>
            <span id="notification-count" style="display: none;">0</span>
            <div id="notifications-dropdown" style="display: none;"></div>
        </div>
        <a href="{{ url_for('auth.logout') }}" class="btn-secondary px-4 py-2 rounded">Logout</a>
    </div>
</nav>
{% endblock %}
{% block content %}
<div class="page-content">
    {% block tailor_content %}{% endblock %}
</div>
{% endblock %}
