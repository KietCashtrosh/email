{% extends "base.html" %}

{% block content %}
<style>
    .portal-nav {
        background-color: #f8f9fa;
        padding: 10px 0;
        border-bottom: 1px solid #ddd;
        margin-bottom: 30px;
        text-align: center;
    }
    .portal-nav a {
        text-decoration: none;
        color: #007bff;
        margin: 0 20px;
        font-weight: bold;
        font-size: 1.1em;
    }
    .portal-container {
        max-width: 1100px;
        margin: 0 auto;
    }

<div class="portal-container">
    <nav class="portal-nav">
        <a href="{{ url_for('tailor.dashboard') }}">Dashboard</a>
        <a href="{{ url_for('tailor.earnings') }}">Earnings</a>
        <a href="{{ url_for('tailor.profile') }}">My Profile</a>
        <a href="{{ url_for('tailor.my_services') }}">My Services</a>
        <a href="{{ url_for('tailor.add_service') }}">Add Service</a>
        <a href="{{ url_for('tailor.orders') }}">My Orders</a>

    </nav>

    {# This is where the content of other tailor pages will go #}
    {% block tailor_content %}{% endblock %}
</div>
{% endblock %}
