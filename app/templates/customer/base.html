{% extends "base.html" %}

{% block content %}
<style>
    .navbar {
        background-color: #fff;
        padding: 15px 30px;
        border-bottom: 1px solid #ddd;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .navbar a { text-decoration: none; color: #333; margin: 0 15px; font-weight: bold; }
    .page-content { max-width: 1100px; margin: 20px auto; }
</style>

<nav class="navbar">
    <div>
        <a href="{{ url_for('customer.dashboard') }}" style="font-size: 1.5em;">Stichie</a>
        <a href="#">Services</a>
        <a href="#">Tailors</a>
    </div>
    <div>
        <a href="{{ url_for('customer.order_history') }}">My Orders</a>
        <a href="{{ url_for('customer.my_profiles') }}">My Family</a>
        <a href="{{ url_for('customer.profile') }}">My Profile</a>
        <a href="{{ url_for('auth.logout') }}">Logout</a>
    </div>
</nav>

<div class="page-content">
    {% block customer_content %} {% endblock %}
</div>
{% endblock %}
