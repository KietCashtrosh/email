<!-- app/templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <style>
        /* Basic styling for notification bell and dropdown */
        .notification-bell {
            position: relative;
            display: inline-block;
            cursor: pointer;
            font-size: 24px;
            margin: 10px;
        }
        #notification-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
        }
        #notifications-dropdown {
            position: absolute;
            top: 40px;
            right: 0;
            background-color: white;
            border: 1px solid #ccc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            width: 300px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 1000;
        }
        .notification-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .notification-item a {
            text-decoration: none;
            color: #333;
        }
        .notification-item a:hover {
            color: #007bff;
        }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    {% if current_user.is_authenticated %}
    <div class="notification-bell">
        <span id="notification-bell">🔔</span>
        <span id="notification-count" style="display: none;">0</span>
        <div id="notifications-dropdown" style="display: none;">
            <!-- Notifications will be populated here -->
        </div>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
    {% if current_user.is_authenticated %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const socket = io.connect('{{ request.host_url }}');
            const bell = document.getElementById('notification-bell');
            const countEl = document.getElementById('notification-count');
            const dropdown = document.getElementById('notifications-dropdown');

            // Configure Toastr options
            toastr.options = {
                timeOut: 5000,
                positionClass: 'toast-top-right',
                progressBar: true,
                closeButton: true
            };

            // Update notification count display
            function updateCount(count) {
                if (count > 0) {
                    countEl.textContent = count;
                    countEl.style.display = 'block';
                } else {
                    countEl.style.display = 'none';
                }
            }

            // Join user-specific and role-specific rooms on connect
            socket.on('connect', function() {
                socket.emit('join', { room: '{{ current_user.id }}' });
                {% if current_user.role == 'admin' %}
                socket.emit('join', { room: 'admin' });
                {% elif current_user.role == 'delivery_partner' %}
                socket.emit('join', { room: 'delivery_partner' });
                {% endif %}
                console.log('Connected to SocketIO server');
            });

            // Handle connection errors
            socket.on('connect_error', function(error) {
                console.error('SocketIO connection error:', error);
                toastr.error('Failed to connect to notification server. Please refresh.', 'Connection Error');
            });

            // Handle new notifications
            socket.on('new_notification', function(data) {
                let currentCount = parseInt(countEl.textContent || '0');
                updateCount(currentCount + 1);
                toastr.success(data.message, 'New Notification', {
                    onclick: function() {
                        if (data.link) {
                            window.location.href = data.link;
                        }
                    }
                });
            });

            // Fetch initial unread count
            fetch("{{ url_for('notifications.unread_count') }}")
                .then(response => {
                    if (!response.ok) throw new Error('Failed to fetch unread count');
                    return response.json();
                })
                .then(data => updateCount(data.count))
                .catch(error => {
                    console.error('Error fetching unread count:', error);
                    toastr.error('Error loading notifications.', 'Error');
                });

            // Handle bell click to show/hide notifications
            bell.addEventListener('click', function() {
                const isVisible = dropdown.style.display === 'block';
                dropdown.style.display = isVisible ? 'none' : 'block';
                if (!isVisible) {
                    updateCount(0); // Reset count
                    fetch("{{ url_for('notifications.get_notifications') }}")
                        .then(response => {
                            if (!response.ok) throw new Error('Failed to fetch notifications');
                            return response.json();
                        })
                        .then(notifications => {
                            dropdown.innerHTML = '';
                            if (notifications.length === 0) {
                                dropdown.innerHTML = '<div class="notification-item">No new notifications.</div>';
                            }
                            notifications.forEach(n => {
                                const item = document.createElement('div');
                                item.className = 'notification-item';
                                item.innerHTML = `<a href="${n.link || '#'}">${n.message}</a>`;
                                dropdown.appendChild(item);
                            });
                        })
                        .catch(error => {
                            console.error('Error fetching notifications:', error);
                            toastr.error('Error loading notifications.', 'Error');
                        });
                }
            });
        });
    </script>
    {% endif %}
</body>
</html>
