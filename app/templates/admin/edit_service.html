{% extends "base.html" %}

{% block content %}
<h1>Edit Service</h1>
<form method="POST">
    <label>Name: <input type="text" name="name" value="{{ service.name }}" required></label><br>
    <label>Category: <input type="text" name="category" value="{{ service.category }}"></label><br>
    <button type="submit">Update</button>
</form>
{% endblock %}
