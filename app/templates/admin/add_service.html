{% extends "admin/base.html" %}
{% block title %}Add New Service{% endblock %}

{% block admin_content %}
    <!-- Include Tailwind CSS for rich styling -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

    <div class="min-h-screen bg-gray-100 flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-xl shadow-2xl transform transition-all duration-300 hover:shadow-3xl">
            <div>
                <h1 class="text-3xl font-extrabold text-gray-900 text-center mb-6">Add New Master Service</h1>
                <p class="text-gray-600 text-center mb-6">Create a new service to expand your tailoring offerings.</p>
            </div>
            <form method="POST" enctype="multipart/form-data" class="mt-8 space-y-6">
                <div class="space-y-4">
                    <!-- Service Name Field -->
                    <div>
                        <label for="name" class="block text-sm font-medium text-gray-700">Service Name <span class="text-red-500">*</span></label>
                        <input type="text" name="name" id="name" required class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
                    </div>

                    <!-- Service Image Field -->
                    <div>
                        <label for="image_file" class="block text-sm font-medium text-gray-700">Service Image</label>
                        <input type="file" name="image_file" id="image_file" accept="image/png, image/jpeg, image/gif" class="mt-1 block w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 transition duration-200 ease-in-out">
                    </div>

                    <!-- Categories Field -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Categories</label>
                        <div class="mt-2 space-y-2">
                            {% for category in categories %}
                                <div class="flex items-center">
                                    <input type="checkbox" name="category_ids" value="{{ category.id }}" id="cat_{{ category.id }}" class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded">
                                    <label for="cat_{{ category.id }}" class="ml-2 text-sm text-gray-900">{{ category.name }}</label>
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <div>
                    <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-200 ease-in-out">
                        Create Service
                    </button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
